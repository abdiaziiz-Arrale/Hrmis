  .stepflow{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);flex-wrap:wrap;}

(function seedAttendance(){
  var days=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10));}
  EMPLOYEES.forEach(function(e){
    ATTENDANCE[e.id]=[];
    days.forEach(function(d,idx){
      if(e.status==="On Leave" && idx>=5){ATTENDANCE[e.id].push({date:d,checkIn:"",checkOut:"",status:"On Leave",hours:0});return;}
      var late=(idx%4===0 && e.id==="EMP-2026-0006");
      var ci=late?"09:34":"08:5"+(idx%9); var co="17:0"+(idx%6);

      ATTENDANCE[e.id].push({date:d,checkIn:ci,checkOut:co,status:late?"Late":"Present",hours:h});
    });
  });
})();

function kpi(lab,val,accent,delta,up){var d=delta?'<div style="display:flex;align-items:center;gap:4px;margin-top:11px;font-size:12px;font-weight:600;color:'+(up?C.green:C.red)+'">'+icon(up?"up":"alert",14,up?C.green:C.red)+delta+'</div>':'';return '<div class="card kpi"><div class="row"><div><div class="lab">'+lab+'</div><div class="val">'+val+'</div></div><div class="dot" style="background:'+accent+'"></div></div>'+d+'</div>';}
function pill(t,tone){return '<span class="pill '+(tone||"neutral")+'">'+esc(t)+'</span>';}
function statusTone(s){s=(s||"").toLowerCase();if(/active|present|approved|completed|exceeds|hired|compliant|resolved|ready|paid|on track|strong/.test(s))return"green";if(/probation|late|interview|developing|in progress|calculated|upcoming|cleared/.test(s))return"blue";if(/on leave|pending|enrolled|draft|reported|settled|moderate|requested|open/.test(s))return"amber";if(/absent|rejected|below|terminated|major|gap|action|expired|at risk|suspended|exited/.test(s))return"red";return"neutral";}
function leaveTone(s){if(s==="APPROVED")return"green";if(s==="REJECTED")return"red";if(s==="PENDING_HR")return"blue";return"amber";}

    var ci=rec&&rec.checkIn?rec.checkIn:""; var co=rec&&rec.checkOut?rec.checkOut:"";

function leaveTable(reqs,withActions){

function openForm(opts){

function checkIn(id){
  var t=todayStr();var arr=ATTENDANCE[id]||(ATTENDANCE[id]=[]);var rec=arr.filter(function(a){return a.date===t;})[0];
  var now=new Date();var hh=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  var late=(now.getHours()>9||(now.getHours()===9&&now.getMinutes()>15));
  if(!rec){rec={date:t,checkIn:hh,checkOut:"",status:late?"Late":"Present",hours:0};arr.push(rec);}else{rec.checkIn=hh;rec.status=late?"Late":"Present";}
  toast("Checked in at "+hh+(late?" (late)":""));render();
}
function checkOut(id){
  var t=todayStr();var arr=ATTENDANCE[id]||[];var rec=arr.filter(function(a){return a.date===t;})[0];
  if(!rec||!rec.checkIn){toast("Check in first","red");return;}
  var now=new Date();var hh=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  rec.checkOut=hh; var ci=rec.checkIn.split(":");var co=hh.split(":");rec.hours=Math.max(0,Math.round(((+co[0]+ +co[1]/60)-(+ci[0]+ +ci[1]/60))*10)/10);
  toast("Checked out — "+rec.hours+"h logged");render();
}

function downloadCSV(filename,matrix){
  var csv=matrix.map(function(row){return row.map(function(c){var v=(c==null?"":String(c));if(/[",\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"';return v;}).join(",");}).join("\n");
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast("Downloaded "+filename);
}

  var t=todayStr(),present=0,late=0,out=0,none=0;
  var rows=attFiltered().map(function(e){
    var rec=(ATTENDANCE[e.id]||[]).filter(function(a){return a.date===t;})[0];

/* =============================== extra delegated listener =============================== */
document.getElementById("content").addEventListener("click",function(ev){
  var ex=ev.target.closest("[data-exp]");
  if(ex){var v=ex.getAttribute("data-exp");
    if(v==="employees")exportEmployees();
    else if(v==="attendance")exportAttendance();
    else if(v==="leave")exportLeave();
    else if(v==="users")exportUsers();
    else if(v.indexOf("g:")===0)exportG(v.slice(2));
    else if(v.indexOf("rep:")===0)exportReport(v.slice(4));
    return;}
  var st=ev.target.closest("[data-set]");
  if(st){var a=st.getAttribute("data-set"),val=st.getAttribute("data-val");
    if(a==="company"){CONFIG.company=document.getElementById("setCompany").value;CONFIG.region=document.getElementById("setRegion").value;CONFIG.currency=document.getElementById("setCurrency").value;var bt=document.querySelector(".brand .t2");if(bt)bt.textContent=CONFIG.company;toast("Company settings saved");}
    else if(a==="add-dept"){var nd=document.getElementById("setDept").value.trim();if(nd&&DEPTS.indexOf(nd)<0){DEPTS.push(nd);toast("Department added");render();}}
    else if(a==="del-dept"){var idx=DEPTS.indexOf(val);if(idx>=0){DEPTS.splice(idx,1);toast("Department removed","red");render();}}
    else if(a==="add-leavetype"){openForm({title:"Add leave type",submit:"Add",fields:[{key:"name",label:"Name",req:true,half:true},{key:"entitled",label:"Days per year",type:"number",half:true}],onSubmit:function(v){LEAVE_TYPES.push({id:v.name.toLowerCase().replace(/\s/g,""),name:v.name,entitled:Number(v.entitled)||0});toast("Leave type added");render();}});}
    else if(a==="del-leavetype"){LEAVE_TYPES=LEAVE_TYPES.filter(function(x){return x.id!==val;});toast("Leave type removed","red");render();}
    else if(a==="add-comp"){openForm({title:"Add salary component",submit:"Add",fields:[{key:"name",label:"Name",req:true},{key:"type",label:"Type",type:"select",options:["Allowance","Deduction"],half:true},{key:"calc",label:"Calculation",type:"select",options:["Fixed","Percent"],half:true},{key:"value",label:"Value",type:"number",half:true}],onSubmit:function(v){COMPONENTS.push({id:uid("C"),name:v.name,type:v.type,calc:v.calc,value:Number(v.value)||0});toast("Component added");render();}});}
    else if(a==="del-comp"){COMPONENTS=COMPONENTS.filter(function(x){return x.id!==val;});toast("Component removed","red");render();}
    return;}
  var ua=ev.target.closest("[data-uact]");
  if(ua){var act=ua.getAttribute("data-uact"),id=ua.getAttribute("data-id");
    if(act==="add")addUser();
    else if(act==="toggle"){var u=byId(USERS,id);if(u){u.active=!u.active;toast("User "+(u.active?"activated":"deactivated"));render();}}
    else if(act==="del"){USERS=USERS.filter(function(x){return x.id!==id;});toast("User removed","red");render();}
    return;}
});
document.querySelector(".brand .t2").textContent=CONFIG.company;

setBurger();
render();
</script>
</body>
</html>
