<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HRMIS — Human Resource Management System</title>
<style>
  :root{
    --navy:#16233A; --amber:#E8A838; --amberDk:#C6871B; --teal:#1D6E82; --plum:#7A2E43;
    --bg:#F3F5F9; --card:#FFFFFF; --ink:#18243A; --muted:#64748B; --line:#E4E9F1;
    --green:#2F9E6A; --red:#D2544B;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;}
  button{font-family:var(--sans);}
  input,select,textarea{font-family:var(--sans);}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#cbd3e0;border-radius:8px;}

  .app{display:flex; min-height:100vh;}
  .sidebar{width:258px; background:var(--navy); color:#fff; flex-shrink:0; position:sticky; top:0; height:100vh; display:flex; flex-direction:column;}
  .brand{padding:22px 22px 18px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:11px;}
  .brand .logo{width:40px;height:40px;border-radius:10px;background:var(--amber);color:var(--navy);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:19px;}
  .brand .t1{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1;}
  .brand .t2{font-size:10.5px;color:#93A0B8;margin-top:3px;letter-spacing:.04em;}
  nav{padding:12px;overflow-y:auto;flex:1;}
  .navitem{width:100%;display:flex;align-items:center;gap:11px;cursor:pointer;background:transparent;border:none;border-left:3px solid transparent;color:#AEB9CD;padding:10px 12px;border-radius:8px;margin-bottom:2px;font-size:13.5px;font-weight:500;text-align:left;}
  .navitem:hover{color:#fff;background:rgba(255,255,255,.05);}
  .navitem.on{background:rgba(232,168,56,.14);border-left-color:var(--amber);color:#fff;font-weight:600;}
  .navitem .num{margin-left:auto;font-size:10.5px;color:#5E6B85;font-variant-numeric:tabular-nums;}
  .foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7E8CA6;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  header.top{height:62px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5;}
  .crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);}
  .crumb b{color:var(--ink);font-weight:600;}
  .burger{display:none;background:none;border:none;cursor:pointer;color:var(--ink);}
  .topright{display:flex;align-items:center;gap:16px;}
  .avatar{width:34px;height:34px;border-radius:20px;background:var(--navy);color:var(--amber);display:grid;place-items:center;font-weight:600;font-size:13px;}
  .who .n{font-size:13px;font-weight:600;} .who .r{font-size:11px;color:var(--muted);}
  main.content{padding:26px 28px 60px;max-width:1180px;width:100%;margin:0 auto;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(22,35,58,.04);}
  .sectitle{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .eyebrow{color:var(--amberDk);font-weight:700;letter-spacing:.14em;font-size:11px;text-transform:uppercase;margin-bottom:6px;}
  h1.page{font-family:var(--serif);font-size:30px;font-weight:700;margin:0;line-height:1.1;}
  .lead{color:var(--muted);margin:-8px 0 22px;max-width:640px;font-size:14.5px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{padding:18px 20px;} .kpi .lab{color:var(--muted);font-size:12.5px;font-weight:500;margin-bottom:8px;}
  .kpi .val{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1;}
  .kpi .dot{width:8px;height:8px;border-radius:8px;margin-top:6px;}
  .kpi .delta{display:flex;align-items:center;gap:4px;margin-top:12px;font-size:12.5px;font-weight:600;}
  .kpi .delta span{color:var(--muted);font-weight:400;}
  .row{display:flex;justify-content:space-between;align-items:flex-start;}
  .pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;display:inline-block;}
  .pill.neutral{background:#EEF1F6;color:var(--muted);} .pill.green{background:#E6F4EC;color:var(--green);}
  .pill.amber{background:#FBF0D9;color:var(--amberDk);} .pill.red{background:#FBE9E7;color:var(--red);} .pill.blue{background:#E6EEF6;color:var(--teal);}
  .btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;font-weight:600;padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);}
  .btn.primary{border:none;background:var(--navy);color:#fff;} .btn:hover{filter:brightness(.98);}
  .btn:active{transform:translateY(1px);}
  .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px;}
  .grid11{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .ctitle{font-weight:600;margin-bottom:4px;} .csub{color:var(--muted);font-size:12.5px;margin-bottom:14px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:12px 16px;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);}
  td{padding:12px 16px;color:var(--ink);border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFBFD;}
  .mono{font-variant-numeric:tabular-nums;color:var(--muted);}
  .rowbtns{display:flex;gap:6px;justify-content:flex-end;}
  .iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--muted);}
  .iconbtn:hover{color:var(--ink);background:#F5F7FB;} .iconbtn.danger:hover{color:var(--red);border-color:#F3C9C4;background:#FDF3F2;}
  .searchbar{display:flex;align-items:center;gap:8px;background:#F5F7FB;border:1px solid var(--line);border-radius:9px;padding:8px 12px;flex:1;min-width:180px;max-width:320px;}
  .searchbar input{border:none;outline:none;background:transparent;font-size:13.5px;width:100%;color:var(--ink);}
  .filterbar{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .fsel{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;background:var(--card);color:var(--ink);cursor:pointer;}
  .bar-track{height:8px;background:#EEF1F6;border-radius:20px;overflow:hidden;}
  .bar-fill{height:100%;transition:width .4s ease;}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px;}
  .tile{text-align:left;cursor:pointer;background:#FAFBFD;border:1px solid var(--line);border-radius:11px;padding:13px 14px;display:flex;gap:11px;align-items:center;}
  .tile:hover{background:#F2F5FA;}
  .tile .ic{width:34px;height:34px;border-radius:9px;background:var(--navy);display:grid;place-items:center;flex-shrink:0;}
  .tile .nm{display:block;font-size:13px;font-weight:600;} .tile .fn{display:block;font-size:11px;color:var(--muted);}
  .listrow{display:flex;align-items:center;gap:12px;padding:13px 8px;border-bottom:1px solid var(--line);}
  .listrow:last-child{border-bottom:none;}
  .listrow .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;}
  .legend div{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .legend .sw{width:9px;height:9px;border-radius:3px;}
  .empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13.5px;}
  .sechead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);}
  .sechead .t{font-weight:600;}

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:60;overflow-y:auto;animation:fade .15s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:480px;box-shadow:0 24px 60px rgba(15,23,42,.28);animation:pop .16s ease;}
  @keyframes pop{from{transform:translateY(8px) scale(.99);opacity:.6}to{transform:none;opacity:1}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-family:var(--serif);font-size:20px;font-weight:700;}
  .modal-x{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:8px;}
  .modal-x:hover{background:#F1F4F8;color:var(--ink);}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
  .field{display:block;margin-bottom:14px;} .field span{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;color:var(--ink);outline:none;background:var(--card);}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,168,56,.15);}
  .field textarea{resize:vertical;}
  .grid-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}

  /* toasts */
  #toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{display:flex;align-items:center;gap:9px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:11px;font-size:13.5px;font-weight:500;box-shadow:0 10px 30px rgba(15,23,42,.3);opacity:0;transform:translateY(10px);transition:.3s;max-width:90vw;}
  .toast.show{opacity:1;transform:none;} .toast.red{background:var(--red);} .toast.green{background:var(--green);}

  @media (max-width:900px){ .grid2,.grid11,.grid-fields{grid-template-columns:1fr;} }
  @media (max-width:860px){
    .sidebar{position:fixed;z-index:40;transform:translateX(-100%);transition:transform .25s ease;}
    .sidebar.open{transform:translateX(0);box-shadow:0 0 60px rgba(0,0,0,.4);}
    .burger{display:block;} .who{display:none;} main.content{padding:20px 16px 48px;}
  }
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;} .scrim.show{display:block;}
</style>
</head>

/* ---------------------------- utilities ---------------------------- */
var _seq=5000;
function uid(pref){ _seq++; return (pref||"ID")+"-"+_seq; }
function clone(o){ var n={}; for(var k in o) n[k]=o[k]; return n; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function money(n){ return "$"+Number(n||0).toLocaleString(); }
function today(){ var d=new Date(); return d.toISOString().slice(0,10); }
function byId(arr,id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
function toneFor(s){ s=(s||"").toLowerCase();
  if(/approved|complete|resolved|compliant|active|ready now|on track|paid/.test(s)) return "green";
  if(/at risk|action needed|below|gap|terminated|major/.test(s)) return "red";
  if(/probation|interview|developing|1-2/.test(s)) return "blue";
  return "amber";
}

/* ---------------------------- html helpers ---------------------------- */
function kpi(lab,val,accent,delta,up){
  var d = delta ? '<div class="delta" style="color:'+(up?C.green:C.red)+'">'+icon(up?"up":"down",14,up?C.green:C.red)+delta+' <span>vs last period</span></div>' : '';
  return '<div class="card kpi"><div class="row"><div><div class="lab">'+lab+'</div><div class="val">'+val+'</div></div><div class="dot" style="background:'+accent+'"></div></div>'+d+'</div>';
}
function pill(txt,tone){ return '<span class="pill '+(tone||toneFor(txt))+'">'+esc(txt)+'</span>'; }
function sectitle(eyebrow,title,actions){ return '<div class="sectitle"><div><div class="eyebrow">'+eyebrow+'</div><h1 class="page">'+title+'</h1></div>'+(actions||"")+'</div>'; }
function modHead(m,actions){ return sectitle('Function '+(m.n==="—"?"":m.n), m.name, actions||"")+'<p class="lead">'+m.sub+'.</p>'; }
function addBtn(store,label){ return '<button class="btn primary" data-action="add" data-store="'+store+'">'+icon("plus",15,"#fff")+(label||"Add")+'</button>'; }
function rowActions(store,id){ return '<div class="rowbtns"><button class="iconbtn" data-action="edit" data-store="'+store+'" data-id="'+id+'" title="Edit">'+icon("edit",15)+'</button><button class="iconbtn danger" data-action="del" data-store="'+store+'" data-id="'+id+'" title="Delete">'+icon("trash",15)+'</button></div>'; }

function donut(el){

function toast(msg,tone){
  var t=document.createElement("div"); t.className="toast "+(tone||"green");
  t.innerHTML=icon(tone==="red"?"alert":"check",16,"#fff")+"<span>"+esc(msg)+"</span>";
  document.getElementById("toasts").appendChild(t);
  setTimeout(function(){t.classList.add("show");},10);
  setTimeout(function(){t.classList.remove("show");setTimeout(function(){t.remove();},300);},2600);
}
function modal(title,body,foot){
  var wrap=document.createElement("div"); wrap.className="modal-overlay";
  wrap.innerHTML='<div class="modal"><div class="modal-head"><h3>'+esc(title)+'</h3><button class="modal-x">'+icon("x",20)+'</button></div><div class="modal-body">'+body+'</div>'+(foot?'<div class="modal-foot">'+foot+'</div>':'')+'</div>';
  document.body.appendChild(wrap);
  function close(){ wrap.remove(); }
  wrap.querySelector(".modal-x").onclick=close;
  wrap.addEventListener("click",function(e){ if(e.target===wrap) close(); });
  return {el:wrap,close:close};
}
function fieldHTML(f){
  var opts=typeof f.options==="function"?f.options():f.options;
  var val=f.value!=null?f.value:"";
  var inner;
  if(f.type==="select"){
    inner='<select name="'+f.key+'">'+opts.map(function(o){return '<option'+(String(o)===String(val)?' selected':'')+'>'+esc(o)+'</option>';}).join("")+'</select>';
  } else if(f.type==="textarea"){
    inner='<textarea name="'+f.key+'" rows="3">'+esc(val)+'</textarea>';
  } else {
    inner='<input name="'+f.key+'" type="'+(f.type||"text")+'"'+(f.type==="number"?' step="any"':'')+' value="'+esc(val)+'">';
  }
  return '<label class="field"><span>'+esc(f.label)+(f.required?' *':'')+'</span>'+inner+'</label>';
}
function openForm(opts){
  var half=opts.fields.filter(function(f){return f.half;}), full=opts.fields.filter(function(f){return !f.half;});
  var body='<form id="theForm">';
  full.forEach(function(f){ if(f.half) return; });
  // render in order but wrap consecutive half fields in a grid
  var i=0, fs=opts.fields;
  while(i<fs.length){
    if(fs[i].half){
      body+='<div class="grid-fields">';
      while(i<fs.length && fs[i].half){ body+=fieldHTML(fs[i]); i++; }
      body+='</div>';
    } else { body+=fieldHTML(fs[i]); i++; }
  }
  body+='</form>';
  var foot='<button class="btn" data-cancel>Cancel</button><button class="btn primary" data-save>'+(opts.submitLabel||"Save")+'</button>';
  var m=modal(opts.title,body,foot);
  m.el.querySelector("[data-cancel]").onclick=m.close;
  m.el.querySelector("[data-save]").onclick=function(){
    var form=m.el.querySelector("#theForm"), vals={};
    opts.fields.forEach(function(f){
      var node=form.elements[f.key]; var v=node?node.value:"";
      if(f.type==="number") v=(v===""?0:parseFloat(v)||0);
      vals[f.key]=v;
    });
    var miss=opts.fields.filter(function(f){return f.required && (vals[f.key]===""||vals[f.key]==null);});
    if(miss.length){ toast("Please fill: "+miss.map(function(f){return f.label;}).join(", "),"red"); return; }
    opts.onSubmit(vals); m.close();
  };
  // focus first field
  var first=m.el.querySelector("input,select,textarea"); if(first) first.focus();
}
function confirmDialog(msg,onYes){
  var m=modal("Please confirm",'<p style="margin:0;color:'+C.ink+';font-size:14px;line-height:1.5">'+esc(msg)+'</p>',
    '<button class="btn" data-no>Cancel</button><button class="btn primary" data-yes style="background:'+C.red+'">Delete</button>');
  m.el.querySelector("[data-no]").onclick=m.close;
  m.el.querySelector("[data-yes]").onclick=function(){ onYes(); m.close(); };
}

/* ---- generic CRUD ---- */
function addEntity(store){
  var cfg=ENTITIES[store]; if(!cfg){ toast("Not available","red"); return; }
  openForm({title:"Add "+cfg.label, submitLabel:"Add "+cfg.label,
    fields:cfg.fields.map(function(f){return clone(f);}),
    onSubmit:function(v){ v.id=uid(cfg.idpref); DB[store].unshift(v); toast(cfg.label+" added"); renderView(); }});
}
function editEntity(store,id){
  var cfg=ENTITIES[store], item=byId(DB[store],id); if(!item) return;
  openForm({title:"Edit "+cfg.label, submitLabel:"Save changes",
    fields:cfg.fields.map(function(f){var c=clone(f); c.value=item[f.key]; return c;}),
    onSubmit:function(v){ for(var k in v) item[k]=v[k]; toast(cfg.label+" updated"); renderView(); }});
}
function delEntity(store,id){
  var cfg=ENTITIES[store];
  confirmDialog("Delete this "+cfg.label.toLowerCase()+"? This can't be undone.",function(){
    DB[store]=DB[store].filter(function(x){return x.id!==id;}); toast(cfg.label+" deleted","red"); renderView();
  });
}
function advanceCandidate(id){
  var c=byId(DB.candidates,id); if(!c) return;
  var i=STAGES.indexOf(c.stage);
  if(i<STAGES.length-1){ c.stage=STAGES[i+1]; toast(c.name+" moved to "+c.stage); } else { toast(c.name+" is already hired"); }
  renderView();
}
function runPayroll(){
  var active=DB.employees.filter(function(e){return e.status==="Active"||e.status==="Probation";});
  if(!active.length){ toast("No payable employees","red"); return; }
  var gross=active.reduce(function(s,e){return s+(+e.salary||0);},0);
  var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var d=new Date(), label=months[d.getMonth()]+" "+d.getFullYear();
  var run={id:uid("PY"),month:label,count:active.length,gross:gross,ded:Math.round(gross*0.19),status:"Pending approval",date:today()};
  DB.payrolls.unshift(run); toast("Payroll run created for "+active.length+" employees"); renderView();
}
function approvePayroll(id){ var r=byId(DB.payrolls,id); if(!r) return; r.status="Approved & paid"; toast("Payroll approved & released","green"); renderView(); }

/* ================================================================
   RENDER + WIRING
   ================================================================ */
var active="dashboard";
var VIEWS={dashboard:vDashboard,planning:vPlanning,recruitment:vRecruitment,records:vRecords,training:vTraining,
  performance:vPerformance,compensation:vCompensation,payroll:vPayroll,relations:vRelations,safety:vSafety,
  compliance:vCompliance,career:vCareer,engagement:vEngagement};

function drawCharts(){
  document.querySelectorAll("[data-chart]").forEach(function(el){
    var t=el.getAttribute("data-chart");
    if(t==="area")areaChart(el); else if(t==="donut")donut(el); else if(t==="vbars")vbars(el);
    else if(t==="hbars")hbars(el); else if(t==="line")lineChart(el);
  });
}
function renderView(){
  var content=document.getElementById("content");
  content.innerHTML=(VIEWS[active]||vDashboard)();
  window.scrollTo(0,0);
  drawCharts();
  document.getElementById("crumbName").textContent=mod(active).name;
  // employee filters
  var s=document.getElementById("empSearch");
  if(s){ var refresh=function(){document.getElementById("empTable").innerHTML=empRows();};
    document.getElementById("empTable").innerHTML=empRows();
    s.oninput=refresh;
    var fd=document.getElementById("fDept"), fs=document.getElementById("fStatus");
    if(fd) fd.onchange=refresh; if(fs) fs.onchange=refresh;
  }
}
function renderNav(){
  var nav=document.getElementById("nav"),html="";
  MODULES.forEach(function(m){
    html+='<button class="navitem'+(m.id===active?" on":"")+'" data-nav="'+m.id+'">'+icon(m.ic,17,m.id===active?C.amber:"#7E8CA6")+'<span style="flex:1">'+m.name+'</span>'+(m.n!=="—"?'<span class="num">'+m.n+'</span>':'')+'</button>';
  });
  nav.innerHTML=html;
  nav.querySelectorAll("[data-nav]").forEach(function(b){ b.onclick=function(){ go(this.getAttribute("data-nav")); }; });
}
function go(id){ active=id; renderNav(); renderView(); closeSidebar(); setBurger(); }

/* delegated actions inside content */
document.getElementById("content").addEventListener("click",function(e){
  var btn=e.target.closest("[data-action]"); if(!btn) return;
  var a=btn.getAttribute("data-action"), store=btn.getAttribute("data-store"), id=btn.getAttribute("data-id");
  if(a==="go") go(btn.getAttribute("data-go"));
  else if(a==="add") addEntity(store);
  else if(a==="edit") editEntity(store,id);
  else if(a==="del") delEntity(store,id);
  else if(a==="advance") advanceCandidate(id);
  else if(a==="run-payroll") runPayroll();
  else if(a==="approve-payroll") approvePayroll(id);
  else if(a==="export") toast("Report exported (demo)");
});

/* sidebar / chrome */
function openSidebar(){ document.getElementById("sidebar").classList.add("open"); document.getElementById("scrim").classList.add("show"); }
function closeSidebar(){ document.getElementById("sidebar").classList.remove("open"); document.getElementById("scrim").classList.remove("show"); }
var burger=document.getElementById("burger");
function setBurger(){ burger.innerHTML=icon(document.getElementById("sidebar").classList.contains("open")?"x":"menu",22,C.ink); }
burger.onclick=function(){ var sb=document.getElementById("sidebar"); if(sb.classList.contains("open"))closeSidebar(); else openSidebar(); setBurger(); };
document.getElementById("scrim").onclick=function(){ closeSidebar(); setBurger(); };
document.getElementById("crumbIcon").innerHTML=icon("chevron",14,C.muted);
document.getElementById("bellWrap").innerHTML=icon("bell",19,C.muted)+'<span style="position:absolute;top:-3px;right:-3px;width:8px;height:8px;background:'+C.amber+';border-radius:8px;border:2px solid #fff"></span>';
setBurger();

var rt; window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(drawCharts,150); });

renderNav(); renderView();

</script>
